<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        background-color: rgb(34, 36, 42);
      }
      .calculator {
        border: 1px solid rgb(170, 170, 170);
        border-radius: 10px;
        width: 300px;
        background-color: rgb(0, 0, 0);
        padding: 5px 0px 5px 5px;
      }
      button {
        width: 20%;
        margin: 5px;
        margin-bottom: 8px;
        padding: 10px 0px;
        border: 1px solid;
        border-radius: 5px;
        box-shadow: 0px 3px 0px rgb(255, 165, 0);
        transition:
          transform 0.1s,
          box-shadow 0.1s,
          background-color 0.1s,
          border-color 0.1s,
          color 0.1s opacity 0.1s;
      }
      button:active {
        box-shadow: 0px 0px 0px rgb(255, 165, 0);
        transform: translateY(3px);
      }
      .filled-button {
        background-color: rgb(255, 165, 0);
        border-color: rgb(255, 165, 0);
        border-color: black;
        color: black;
      }
      .filled-button:hover {
        background-color: black;
        border-color: rgb(255, 140, 0);
        color: white;
      }
      .outlined-button {
        background-color: rgb(0, 0, 0);
        border-color: rgb(255, 165, 0);
        color: white;
      }
      .outlined-button:hover {
        /* background-color: rgb(255, 165, 0);
    border-color: black;
    color: black; */
        opacity: 0.8;
      }
      output {
        overflow: hidden;
        display: block;
        width: 94%;
        height: 60px;
        background-color: rgb(0, 0, 0);
        color: white;
        font-size: 50px;
        font-family: "Courier New", Courier, monospace;
        font-weight: 600;
        text-align: right;
        align-content: center;
        padding-right: 10px;
        border-radius: 10px;
        margin-bottom: 10px;
        border-bottom: 0.1px solid rgb(120, 119, 119);
      }
    </style>
  </head>
  <body>
    <div class="calculator">
      <div><output>0</output></div>
      <div>
        <div>
          <button class="filled-button">AC</button>
          <button class="filled-button">DEL</button>
          <button class="filled-button">%</button>
          <button class="filled-button">+</button>
        </div>
        <div>
          <button class="outlined-button">7</button>
          <button class="outlined-button">8</button>
          <button class="outlined-button">9</button>
          <button class="filled-button">-</button>
        </div>
        <div>
          <button class="outlined-button">4</button>
          <button class="outlined-button">5</button>
          <button class="outlined-button">6</button>
          <button class="filled-button">*</button>
        </div>
        <div>
          <button class="outlined-button">3</button>
          <button class="outlined-button">2</button>
          <button class="outlined-button">1</button>
          <button class="filled-button">/</button>
        </div>
        <div>
          <button class="outlined-button">0</button>
          <button class="outlined-button">.</button>
          <button class="filled-button" style="width: 44%">=</button>
        </div>
      </div>
    </div>

    <script>
      const output = document.querySelector("output");
      const buttons = document.querySelectorAll("button");
      let currentInput = "0";
      let lastResult = "";

      buttons.forEach((button) => {
        button.addEventListener("click", () => {
          const value = button.textContent;

          if (
            currentInput === "0" &&
            value !== "AC" &&
            value !== "DEL" &&
            value !== "="
          ) {
            currentInput = "";
          }

          if (value === "AC") {
            currentInput = "0";
            lastResult = "";
          } else if (value === "DEL") {
            if (currentInput === "0") {
              return;
            }
            currentInput = currentInput.slice(0, -1);
          } else if (value === "=") {
            try {
              lastResult = eval(currentInput);
              currentInput = lastResult.toString();
            } catch (e) {
              currentInput = "Error";
            }
          } else {
            currentInput += value;
          }

          output.value = currentInput;
          if (value === "=") {
            currentInput = "0";
          }
        });
      });
    </script>
  </body>
</html>
